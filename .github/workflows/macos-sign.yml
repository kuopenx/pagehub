name: Sign macOS draft release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft release tag
        required: true
permissions:
  contents: write
jobs:
  sign:
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ inputs.tag }}
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - name: Validate inputs and draft status
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test -n "$APPLE_CERTIFICATE_P12"
          test -n "$APPLE_SIGNING_IDENTITY"
          test -n "$APPLE_ID"
          test -n "$APPLE_TEAM_ID"
          test -n "$APPLE_APP_PASSWORD"
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
      - name: Sign, notarize and replace draft assets
        shell: bash
        run: |
          set -euo pipefail
          keychain_path="$RUNNER_TEMP/pagehub-signing.keychain-db"
          cert_path="$RUNNER_TEMP/pagehub-certificate.p12"
          keychain_password="$(openssl rand -hex 24)"
          cleanup() { security delete-keychain "$keychain_path" || true; rm -f "$cert_path"; }
          trap cleanup EXIT
          printf '%s' "$APPLE_CERTIFICATE_P12" | base64 --decode > "$cert_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$cert_path" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path" >/dev/null
          security list-keychains -d user -s "$keychain_path"
          mkdir -p "$RUNNER_TEMP/pagehub-signing"
          cd "$RUNNER_TEMP/pagehub-signing"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern '*darwin*.tar.gz' --pattern checksums.txt
          for archive in *darwin*.tar.gz; do
            work_dir="${archive%.tar.gz}"
            mkdir "$work_dir"
            tar -xzf "$archive" -C "$work_dir"
            codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$work_dir/pagehub"
            codesign --verify --strict --verbose=2 "$work_dir/pagehub"
            ditto -c -k "$work_dir" "$work_dir.zip"
            xcrun notarytool submit "$work_dir.zip" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait --output-format json > "$work_dir-notary.json"
            test "$(ruby -rjson -e 'puts JSON.parse(File.read(ARGV[0]))["status"]' "$work_dir-notary.json")" = Accepted
            tar -czf "$archive" -C "$work_dir" .
            awk -v file="$archive" '$2 != file' checksums.txt > checksums.next
            shasum -a 256 "$archive" >> checksums.next
            mv checksums.next checksums.txt
            gh release upload "$RELEASE_TAG" "$archive" --repo "$GITHUB_REPOSITORY" --clobber
          done
          sort -o checksums.txt checksums.txt
          gh release upload "$RELEASE_TAG" checksums.txt --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes 'macOS arm64/amd64 binaries are Developer ID signed and notarized. See checksums.txt. Linux binaries remain unchanged.'
