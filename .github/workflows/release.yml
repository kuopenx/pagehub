name: Source release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (for example v0.3.2)
        required: true
        type: string
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - run: go test -race ./... && go vet ./...
      - run: go build -trimpath -o pagehub ./cmd/pagehub
      - name: Real CLI and MCP acceptance
        run: go run ./cmd/pagehub-verify --binary ./pagehub
      - name: Create source-only draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git show-ref --verify "refs/tags/$RELEASE_TAG"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists: $RELEASE_TAG"
            exit 0
          fi
          cat > "$RUNNER_TEMP/pagehub-release-notes.md" <<'NOTES'
          Pagehub is distributed as source. This release has no precompiled binaries or installers.

          Install on macOS with Homebrew (builds from source):
          ```sh
          brew install kuopenx/tap/pagehub
          ```

          Or use Go 1.26.0+ on macOS or Linux:
          ```sh
          go install github.com/kuopenx/pagehub/cmd/pagehub@latest
          ```

          On macOS, run `pagehub setup` after installation or upgrade to update the background service.
          On Linux, run `pagehub serve` in the foreground.

          Documentation: [English](https://github.com/kuopenx/pagehub#readme) · [简体中文](https://github.com/kuopenx/pagehub/blob/main/README.zh-CN.md).
          GitHub provides the source ZIP and tar.gz archives automatically.
          NOTES
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --draft --title "Pagehub $RELEASE_TAG" --notes-file "$RUNNER_TEMP/pagehub-release-notes.md"
